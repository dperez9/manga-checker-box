{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.fullname | default .Release.Name }}
  namespace: bots
spec:
  schedule: "{{ .Values.cronjob.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60   # Elimina el job tras 60 segundos
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: keinos/sqlite3:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -eo pipefail
                  DB_NAME="{{ .Values.persistence.dbFilename | trimSuffix ".db" }}"
                  BACKUP_DIR="{{ .Values.cronjob.nfs_path }}/{{ .Values.cronjob.backupFolder }}"
                  MAX_BACKUPS={{ .Values.cronjob.maxBackups | default 15 }}
                  DATE=$(date +%F)
                  DEST="${BACKUP_DIR}/${DB_NAME}_${DATE}.db"

                  if [ ! -d "{{ .Values.persistence.mountPath }}" ]; then
                    echo "[WARN] Directory {{ .Values.persistence.mountPath }} does not exist. Skipping backup."
                    exit 1
                  fi

                  mkdir -p "${BACKUP_DIR}"

                  echo "[+] Backing up {{ .Values.persistence.dbFilename }} to ${DEST}"
                  sqlite3 "{{ .Values.persistence.mountPath }}/{{ .Values.persistence.dbFilename }}" ".backup '${DEST}'"
                  gzip -f -9 "${DEST}"
                  echo "[+] Backup completed: ${DEST}.gz"

                  COUNT=$(ls -1 "${BACKUP_DIR}"/${DB_NAME}_*.db.gz 2>/dev/null | wc -l)
                  if [ "${COUNT}" -gt "${MAX_BACKUPS}" ]; then
                    TO_DELETE=$((COUNT - MAX_BACKUPS))
                    echo "[+] ${COUNT} backups present, removing ${TO_DELETE} oldest to keep ${MAX_BACKUPS}"
                    ls -1 "${BACKUP_DIR}"/${DB_NAME}_*.db.gz | sort | head -n "${TO_DELETE}" | xargs -r rm -v
                  fi
              volumeMounts:
                - name: data
                  mountPath: "{{ .Values.persistence.mountPath }}"
                  readOnly: true
                - name: nfs-backup
                  mountPath: "{{ .Values.cronjob.nfs_path }}"
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Values.fullname | default .Release.Name }}
            - name: nfs-backup
              persistentVolumeClaim:
                claimName: "{{ .Values.cronjob.name }}"

{{- end }}

