apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname | default .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # # La agregación del securityCcontext requiere un mayor numero de pruebas
      # securityContext:
      #   runAsNonRoot: true
      #   runAsUser: 1000
      #   runAsGroup: 1000
      #   fsGroup: 1000
      #   allowPrivilegeEscalation: false
      #   readOnlyRootFilesystem: false
      #   seccompProfile:
      #     type: RuntimeDefault
      containers:
        - name: {{ .Values.fullname | default .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          env:
            - name: DB_PATH
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.persistence.dbFilename }}"
            - name: MOZ_DISABLE_CONTENT_SANDBOX
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 1500Mi
            limits:
              cpu: 500m
              memory: 2000Mi
          ports:
            - containerPort: 8081
              protocol: TCP          
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - {{ .Values.livenessProbe.execCommand | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.fullname | default .Release.Name }}
      imagePullSecrets:
      - name: harbor-robot
