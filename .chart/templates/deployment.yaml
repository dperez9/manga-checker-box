apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullname | default .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.fullname | default .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name }}
          env:
            - name: DB_PATH
              value: "{{ .Values.persistence.mountPath }}/{{ .Values.persistence.dbFilename }}"

          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}

          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - {{ .Values.livenessProbe.execCommand | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}

          ports:
            - containerPort: 8081
              protocol: TCP

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.fullname | default .Release.Name }}
      imagePullSecrets:
      - name: harbor-robot
